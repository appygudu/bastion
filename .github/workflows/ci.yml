name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./bastion.db
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/bastion?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      APP_URL: http://127.0.0.1:4317
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
